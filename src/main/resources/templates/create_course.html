<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Add New Course</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/courses}" th:object="${course}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Course Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter course name" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Instructor</label>
                            <input type="text" th:field="*{instructor}" class="form-control" placeholder="Enter instructor name" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" th:field="*{subject}" class="form-control" placeholder="Enter subject" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fee</label>
                            <input type="number" th:field="*{fee}" class="form-control" placeholder="Enter fee amount" required />
                        </div>
                        <button type="submit" class="btn btn-success w-100">Save Course</button>
                    </form>
                </div>
            </div>
            <div class="mt-3 text-center">
                <a th:href="@{/courses}">Back to Course List</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
